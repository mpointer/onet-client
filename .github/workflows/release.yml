name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
      - run: npm install -g npm@11 # OIDC trusted publishing needs npm >= 11.5
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - name: Skip when this version is already on npm (the first release is published by hand)
        id: npm_exists
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "onet-client@$PKG" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "onet-client@$PKG is already published; skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm_exists.outputs.exists != 'true'
        run: npm publish --provenance --access public
